name: Build, test and publish
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified age streaming encryption tool
        run: |
          curl --fail --location --output /tmp/cannabis-age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/cannabis-age.tar.gz' | sha256sum --check
          tar -xzf /tmp/cannabis-age.tar.gz -C /tmp
          echo '/tmp/age' >> "$GITHUB_PATH"
      - run: npm test
      - name: Verify generic compute client and placement
        run: python -m unittest discover -s test -p 'test_compute_client.py' -v
      - name: Execute owned microjob fixtures and verify exact settlement
        run: npm run exercise:microjobs
      - name: Check guest image tooling syntax
        run: python -m py_compile scripts/build-guest-image.py scripts/verify-guest-boot.py scripts/build-guest-firmware.py scripts/measure-guest-snp.py compute/guest-image/boot-check.py
      - name: Verify measurement input snapshots
        run: python -m unittest discover -s test -p 'test_guest_measure.py' -v
      - name: Verify guest resource configuration refusals
        run: python -m unittest discover -s test -p 'test_guest_resources.py' -v
      - name: Verify signed execution profile resource accounting
        run: python -m unittest discover -s test -p 'test_guest_execution.py' -v
      - name: Verify embedded launch authority ownership and path refusals
        run: sudo env PATH="$PATH" node --test --test-name-pattern='embedded authority reads' test/guest-launch.test.mjs
      - name: Exercise kernel CPU, memory, process and deadline limits
        run: sudo python3 -I -B scripts/check-guest-resources.py
      - name: Verify cleanup after supervisor death and stopped supervisors
        run: sudo python3 -I -B scripts/check-guest-guardian.py
      - name: Verify aggregate control and workload lifecycle
        run: sudo python3 -I -B scripts/check-guest-job.py
      - name: Verify immutable launch snapshots and guarded transport cleanup
        run: sudo python3 -I -B scripts/check-guest-launcher.py
      - name: Install pinned tools for disposable Linux isolation checks
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          target = pathlib.Path('/tmp/cannabis-sandbox-packages')
          target.mkdir(exist_ok=False)
          lock = json.loads(pathlib.Path('compute/guest-image/inputs.json').read_text())
          selected = [p for p in lock['packages'] if p['package'] in {'bubblewrap','libcap2','libseccomp2'}]
          assert len(selected) == 3
          for entry in selected:
              assert entry['url'].startswith('https://archive.ubuntu.com/ubuntu/pool/main/')
              with urllib.request.urlopen(entry['url'],timeout=60) as response:
                  data = response.read(entry['bytes']+1)
              assert len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256']
              (target / (entry['package']+'.deb')).write_bytes(data)
          PY
          sudo dpkg --install /tmp/cannabis-sandbox-packages/libcap2.deb /tmp/cannabis-sandbox-packages/libseccomp2.deb /tmp/cannabis-sandbox-packages/bubblewrap.deb
      - name: Exercise native guest filesystem, syscall, network and storage isolation
        run: |
          # Match the measured guest's namespace policy only on this disposable
          # runner. Ubuntu's host AppArmor restriction otherwise denies bwrap's
          # private loopback initialization. Restore the host setting on exit.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            previous=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
            trap 'sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns="$previous"' EXIT
            sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo python3 -I -B scripts/check-guest-sandbox.py
          sudo /usr/bin/python3 -I -B scripts/check-guest-runtime.py --image-root /
          sudo env PATH="$PATH" /usr/bin/python3 -I -B scripts/check-guest-native.py
          sudo env PATH="$PATH" /usr/bin/python3 -I -B scripts/check-guest-execution.py
          sudo env PATH="$PATH" /usr/bin/python3 -I -B scripts/check-funded-native.py
      - run: npm audit --audit-level=high
      - run: npm run build:work-service
      - run: npm run build:site
      - name: Check public pages, documentation links and sections
        run: python scripts/check-site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist-site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: work-service
          path: dist-work
          if-no-files-found: error
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
